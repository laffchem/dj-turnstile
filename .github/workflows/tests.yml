name: Tests

on:
  push:
    branches: [main, update-tests]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        django-version: ['~=5.2.0', '~=6.0.0', '~=6.1.0']
        exclude:
          # Django 6.0 and 6.1 require Python 3.12+
          - python-version: '3.10'
            django-version: '~=6.0.0'
          - python-version: '3.10'
            django-version: '~=6.1.0'
          - python-version: '3.11'
            django-version: '~=6.0.0'
          - python-version: '3.11'
            django-version: '~=6.1.0'

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - run: uv python install ${{ matrix.python-version }}

      - run: uv run --python ${{ matrix.python-version }} --group dev --with "django${{ matrix.django-version }}" pytest
