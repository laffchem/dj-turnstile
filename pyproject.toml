[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-turnstile"
version = "0.2.0"
description = "A reusable Cloudflare Turnstile app for Django"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Laffey", email = "laffeychem@gmail.com" }]
keywords = ["django", "cloudflare", "turnstile", "captcha"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "django>=5.2",
    "niquests>=3.21.2",
]

[project.urls]
Homepage = "https://github.com/laffchem/dj-turnstile"
Issues = "https://github.com/laffchem/dj-turnstile/issues"

[tool.setuptools.packages.find]
include = ["dj_turnstile*"]

[tool.setuptools.package-data]
dj_turnstile = ["templates/**/*.html"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]

